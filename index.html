<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Formulario</title>
</head>
<body>
    <form id="formulario">
        <div>
            <button id="btn1">claro 🟡</button>
            <button id="btn2">oscuro ⚫</button>
        </div>
        <h1>Formulario</h1>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required minlength="4">

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" required minlength="2">

        <label for="correo-electrónico">Correo Electrónico:</label>
        <input type="email" id="correo-electrónico"  required>
    
        <label for="fecha-nacimiento">Fecha Nacimiento:</label>
        <input type="date" id="fecha-nacimiento" required min="1920-01-01" max="2026-08-30"  >

        <label for="residencia">País de residencia:</label>
        <input type="text" id="residencia" required>
        
        <input id ="btn" type="submit" value="¡Enviar!">
    </form>
    <script src="script.js"></script>
</body>
</html>
